<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You Mahal Ko 🌸</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url('IMG_20260920_102407.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            max-width: 90%;
            width: 360px;
            color: #4a4a4a;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d81b60;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .pass-input {
            width: 80%;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #ff80ab;
            border-radius: 12px;
            margin-bottom: 15px;
            outline: none;
            color: #d81b60;
            letter-spacing: 4px;
        }

        .flower-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .flower-option {
            background: #ffe6eb;
            border: 2px solid #ff80ab;
            border-radius: 14px;
            padding: 12px 5px;
            font-size: 2.2rem;
            cursor: pointer;
        }

        .flower-name {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Pinalaking game area at mas malalaking puso para madaling mahuli */
        .game-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .floating-heart {
            position: absolute;
            font-size: 65px; /* Mas malaki na puso */
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            animation: floatSlow 4.5s linear infinite; /* Mas mabagal na paglipad */
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
            user-select: none;
        }

        @keyframes floatSlow {
            0% { transform: translateY(105vh) scale(0.9); opacity: 1; }
            100% { transform: translateY(-15vh) scale(1.1); opacity: 0; }
        }

        .secret-note {
            background: #fff0f5;
            border: 2px dashed #ff4081;
            padding: 15px;
            border-radius: 12px;
            font-style: italic;
            color: #c2185b;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="game-area" id="game-area"></div>

    <!-- LEVEL 1: PASSCODE -->
    <div class="container" id="step-1">
        <h1>For You Mahal Ko ✨</h1>
        <p>I love you always! Bago ka makapasok, ilagay ang secret password:<br><strong>(Clue: Birthday mo + Birthday ko)</strong></p>
        <input type="password" id="passcode" class="pass-input" placeholder="****" maxlength="4">
        <br>
        <button class="btn" onclick="checkPasscode()">Unlock Surprise 🔓</button>
        <p id="pass-error" style="color: red; font-size: 0.85rem; display: none; margin-top: 8px;">Maling Passcode! Subukan ulit. ❤️</p>
    </div>

    <!-- LEVEL 2: HEART CATCHER (5 HEARTS, SLOW & BIG) -->
    <div class="container hidden" id="step-2">
        <h1>Hulihin Mo Sila! 💖</h1>
        <p>I-tap ang <strong>5 malalaking pink hearts</strong> sa screen bago maubos ang oras!</p>
        <p style="font-weight: bold; color: #d81b60; font-size: 1.1rem; margin-bottom: 5px;">
            Oras: <span id="timer">25</span>s | Nahuli: <span id="score">0</span> / 5
        </p>
