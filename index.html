<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers For You 🌸</title>
    <style>
        body {
    margin: 0;
    padding: 0;
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('IMG_20260920_102407.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    color: #4a4a4a;
}

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(230, 100, 150, 0.15);
            max-width: 85%;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #d81b60;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .flower-btn {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .flower-btn:active {
            transform: scale(0.95);
            background-color: #c2185b;
        }

        .flower-display {
            font-size: 4rem;
            margin-top: 20px;
            min-height: 80px;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Flowers For You Mahal Ko </h1>
        <p>U Deserve all the Flowers, I Love You Always<p>
            
        </p> Tap the button below to pick fresh flowers just for you! ❤️</p>
        
        <button class="flower-btn" onclick="pickFlower()">Give Me A Flower 🌸</button>
        
        <div class="flower-display" id="flower">🌸</div>
    </div>

    <script>
        const flowers = ['🌸', '🌺', '🌻', '🌹', '🌷', '💐', '🌼', '🪷'];
        
        function pickFlower() {
            const randomIndex = Math.floor(Math.random() * flowers.length);
            const flowerElement = document.getElementById('flower');
            flowerElement.innerText = flowers[randomIndex];
            
            // Re-trigger animation
            flowerElement.style.animation = 'none';
            flowerElement.offsetHeight; /* trigger reflow */
            flowerElement.style.animation = 'popIn 0.3s ease-out';
        }
    </script>

</body>
</html>
